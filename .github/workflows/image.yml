name: Image

# Publishes ghcr.io/keelinfra/jenkins for each line, from the line's latest published
# release WAR, on the current Debian 13 and Temurin base. Runs daily and rebuilds only
# when something went into the image changed: a new release, a new Debian image, a new
# Temurin release, or the line's docker/ files. Lives on main because scheduled
# workflows only run from the default branch.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/keelinfra/jenkins
  LINE: '2.541'
  BRANCH: stable-2.541
  SYFT_VERSION: 1.54.1
  SYFT_SHA256: c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      debian: ${{ steps.plan.outputs.debian }}
      java: ${{ steps.plan.outputs.java }}
      inputs: ${{ steps.plan.outputs.inputs }}
      date: ${{ steps.plan.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - name: What would go into the image
        id: plan
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft == false and (.tag_name | startswith(\"$LINE.\"))) | .tag_name" | head -1)
          [ -n "$tag" ] || { echo "No published $LINE release yet"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }
          war_sha=$(gh release download "$tag" -R "$GITHUB_REPOSITORY" -p sha256sums.txt -O - | sed -n 's/  jenkins.war$//p')
          debian=$(curl -fsSL "https://hub.docker.com/v2/repositories/library/debian/tags?name=trixie-20&page_size=100" \
            | jq -r '.results[].name' | sed -n 's/^trixie-\([0-9]\{8\}\)-slim$/\1/p' | sort | tail -1)
          java=$(curl -fsSL "https://api.adoptium.net/v3/info/release_versions?release_type=ga&version=%5B17,18)&page_size=1&sort_order=DESC&vendor=eclipse" \
            | jq -r '.versions[0].semver' | tr + _)
          files=$(find docker -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          inputs=$(printf '%s\n' "$tag" "$war_sha" "$debian" "$java" "$files" | sha256sum | cut -d' ' -f1)
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          current=$(docker buildx imagetools inspect "$IMAGE:$LINE" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '(."linux/amd64" // .).config.Labels["io.keelinfra.inputs"] // empty' || true)
          build=true
          if [ "$current" = "$inputs" ] && [ "$FORCE" != true ]; then build=false; fi
          {
            echo "tag=$tag"; echo "debian=$debian"; echo "java=$java"; echo "inputs=$inputs"
            echo "date=$(date -u +%Y%m%d)"; echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$LINE from $tag, Debian trixie-$debian, Temurin $java: build=$build" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - name: Release WAR, checked
        run: |
          mkdir -p work && cd work
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p jenkins.war -p sha256sums.txt
          sha256sum -c sha256sums.txt
          gh attestation verify jenkins.war --repo "$GITHUB_REPOSITORY"
      - name: Build context
        env:
          DEBIAN_VERSION: ${{ needs.plan.outputs.debian }}
          JAVA_VERSION: ${{ needs.plan.outputs.java }}
        run: docker/build.sh work/jenkins.war work/docker
      - name: Build
        run: |
          docker buildx create --use --name es > /dev/null
          mapfile -t args < <(sed 's/^/--build-arg=/' work/docker/build-args)
          docker buildx build "${args[@]}" --platform "${{ matrix.platform }}" \
            --label "io.keelinfra.inputs=${{ needs.plan.outputs.inputs }}" \
            -f work/docker/context/debian/Dockerfile -t es:test --load work/docker/context
      - run: test/image-smoke.sh es:test "${TAG}"
      - name: Plugin boot inside the image
        run: |
          docker run --rm -v "$PWD/test:/test:ro" --entrypoint bash es:test \
            /test/plugin-boot.sh /usr/share/jenkins/jenkins.war /test/plugins-top100.txt /tmp/boot
      - name: Push by digest
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          mapfile -t args < <(sed 's/^/--build-arg=/' work/docker/build-args)
          docker buildx build "${args[@]}" --platform "${{ matrix.platform }}" \
            --label "io.keelinfra.inputs=${{ needs.plan.outputs.inputs }}" \
            -f work/docker/context/debian/Dockerfile --provenance=false \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file work/metadata.json work/docker/context
          digest=$(jq -r '."containerimage.digest"' work/metadata.json)
          mkdir -p work/digests && touch "work/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: work/digests/*
          retention-days: 1

  publish:
    needs: [plan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write      # provenance and SBOM attestations
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Tag the multi-platform image
        id: index
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          refs=(); for f in digests/*; do refs+=("$IMAGE@sha256:$(basename "$f")"); done
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" -t "$IMAGE:$TAG-${{ needs.plan.outputs.date }}" -t "$IMAGE:$LINE" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Published $IMAGE:$TAG, $IMAGE:$TAG-${{ needs.plan.outputs.date }} and $IMAGE:$LINE"
            echo "(Debian trixie-${{ needs.plan.outputs.debian }}, Temurin ${{ needs.plan.outputs.java }}), digest \`$digest\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: SBOM (CycloneDX, Syft from its own release, checksum verified)
        run: |
          cd "$RUNNER_TEMP"
          tgz=syft_${SYFT_VERSION}_linux_amd64.tar.gz
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/$tgz"
          echo "$SYFT_SHA256  $tgz" | sha256sum -c
          tar xzf "$tgz" syft
          ./syft scan "registry:$IMAGE@${{ steps.index.outputs.digest }}" --platform linux/amd64 -q \
            -o "cyclonedx-json=$GITHUB_WORKSPACE/image.cdx.json"
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: image.cdx.json
          push-to-registry: true
