version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: stable-2.541
    labels:
      - dependencies
      - "line: 2.541"
    schedule:
      interval: weekly
    # Skip releases younger than a week: a hijacked release is usually
    # caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  # main's own workflows (image.yml, the release.yml copy)
  - package-ecosystem: github-actions
    directory: /
    labels:
      - dependencies
      - ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
